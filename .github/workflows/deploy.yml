name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, tzer0m]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Stop service
        run: sudo systemctl stop Connect4.service

      - name: Publish
        run: dotnet publish Connect4.Web/Connect4.Web.csproj -c Release -o /home/tzer0m/Services/Connect4

      - name: Start service
        run: sudo systemctl start Connect4.service

      - name: Check status
        run: sudo systemctl status Connect4.service --no-pager
